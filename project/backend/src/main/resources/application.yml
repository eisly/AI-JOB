spring:
  application:
    name: ai-job-backend
  config:
    import: "optional:file:../../.env[.properties],optional:file:./.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:mysql://${MYSQL_BIND_ADDRESS:127.0.0.1}:${MYSQL_PORT:3307}/career_business?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${AIJOB_DB_USERNAME:${MYSQL_USER:${DB_USERNAME:aijob}}}
    password: ${AIJOB_DB_PASSWORD:${MYSQL_PASSWORD:${DB_PASSWORD:}}}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 3000
          # M01：读/写超时放宽到 20 秒覆盖慢 SMTP（实测 16 秒延迟曾被 3 秒超时误判为失败）；
          # 前端找回密码请求超时为 45 秒，可完整覆盖
          timeout: 20000
          writetimeout: 20000

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*.xml

server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-32-bytes-minimum}
    issuer: ${APP_JWT_ISSUER:ai-job-business}
    audience: ${APP_JWT_AUDIENCE:ai-job-user}
    access-ttl-seconds: ${APP_ACCESS_TTL:900}
  session:
    refresh-ttl-seconds: ${APP_REFRESH_TTL:604800}
    cookie-name: ${APP_REFRESH_COOKIE_NAME:refresh_token}
    cookie-path: ${APP_REFRESH_COOKIE_PATH:/api/v1/auth}
    secure: ${APP_COOKIE_SECURE:true}
    same-site: ${APP_COOKIE_SAME_SITE:Lax}
  security:
    frontend-origin: "${APP_FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}"
  mail:
    from: ${MAIL_FROM:no-reply@ai-job.local}
    expose-code-in-response: ${APP_MAIL_EXPOSE_CODE:false}
  reset-code:
    ttl-seconds: ${APP_RESET_CODE_TTL:600}
    max-attempts: ${APP_RESET_CODE_MAX_ATTEMPTS:5}
    cooldown-seconds: ${APP_RESET_CODE_COOLDOWN:60}
  auth:
    dev-user-header-enabled: ${APP_AUTH_DEV_USER_HEADER_ENABLED:false}
    user-jwt-secret: ${APP_AUTH_USER_JWT_SECRET:dev-only-user-jwt-secret-change-me}
    user-jwt-issuer: ${APP_AUTH_USER_JWT_ISSUER:career-auth}
    user-jwt-audience: ${APP_AUTH_USER_JWT_AUDIENCE:career-business}
  agent:
    base-url: ${AGENT_BASE_URL:http://127.0.0.1:8100}
    jwt-secret: ${AGENT_JWT_SECRET:dev-only-internal-jwt-secret-change-me}
    callback-jwt-secret: ${AGENT_CALLBACK_JWT_SECRET:${AGENT_JWT_SECRET:dev-only-internal-jwt-secret-change-me}}
    connect-timeout: ${AGENT_CONNECT_TIMEOUT:5s}
    read-timeout: ${AGENT_READ_TIMEOUT:65s}
    scheduler-enabled: ${AGENT_SCHEDULER_ENABLED:true}
  files:
    storage-dir: ${APP_FILES_STORAGE_DIR:./data/private-files}
    download-signing-secret: ${APP_FILES_DOWNLOAD_SIGNING_SECRET:dev-only-file-signing-secret}
    pdf-font-path: ${APP_PDF_FONT_PATH:}
    # 内部服务（Agent）下载简历原件使用的基础地址；OCR 任务通过签名 URL 下载原文件
    internal-base-url: ${APP_FILES_INTERNAL_BASE_URL:http://127.0.0.1:8080}
  tasks:
    deadline-seconds: ${AI_TASK_DEADLINE_SECONDS:300}
    sse-heartbeat-seconds: ${AI_TASK_SSE_HEARTBEAT_SECONDS:15}
  voice:
    asr-enabled: ${APP_VOICE_ASR_ENABLED:true}
    # 本次仅接入真实 ASR；TTS 仍为 Fake，默认关闭入口，避免把模拟音频当成真实语音服务。
    tts-enabled: ${APP_VOICE_TTS_ENABLED:false}
    consent-required: ${APP_VOICE_CONSENT_REQUIRED:true}
    transcribe-timeout: ${APP_VOICE_TRANSCRIBE_TIMEOUT:12s}
    synthesize-timeout: ${APP_VOICE_SYNTHESIZE_TIMEOUT:10s}
    max-audio-bytes: ${APP_VOICE_MAX_AUDIO_BYTES:8388608}
    max-duration-ms: ${APP_VOICE_MAX_DURATION_MS:180000}
    transcription-ttl-seconds: ${APP_VOICE_TRANSCRIPTION_TTL_SECONDS:1800}
  job-search:
    sources: ${JOB_SEARCH_SOURCES:company_official,web,baidu,tencent,greenhouse}
    per-source: ${JOB_SEARCH_PER_SOURCE:20}
    max-total: ${JOB_SEARCH_MAX_TOTAL:60}
    concurrency: ${JOB_SEARCH_CONCURRENCY:4}
    source-timeout-seconds: ${JOB_SEARCH_SOURCE_TIMEOUT_SECONDS:12}
